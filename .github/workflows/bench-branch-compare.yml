name: "\U0001FA83 bench-branch-compare (branch vs latest tag)"

# Side-by-side Criterion comparison of the latest published release ("prod",
# the baseline) against the branch under test, using the shared
# `bench-compare/benches/compare_common.rs` harness. Both versions are linked
# into each per-width bench binary (prod via the renamed `prod` dep pinned to
# the newest published version, the branch via the `path = ".."` dep) and run
# through the shared public-function surface.
#
# The sweep now fans out over BOTH width AND scale: each per-width bench file
# instantiates the op set at that tier's scale set (dedup{0, S/2, S-1, 30 if
# 30<=S-1}; S = the tier's max SCALE), naming criterion groups
# `<op>_D###_s<scale>` so a single scale is selectable by a criterion
# name-filter (`-- s<scale>`). This surfaces SCALE-dependent regressions the
# old single-scale (all wide tiers @ scale-30) bench hid.
#
# Job graph — plan, compile ONCE, then fan out, then join:
#   plan       : resolve the `features` + `widths` dispatch inputs into a build
#                plan (bench-compare/bbc_plan.py) and REJECT an inconsistent
#                pair in seconds rather than as a compile error 20 minutes in.
#                Emits the tier feature list, the `--bench` target list, the
#                (width, scale) matrix, and whether this run may publish.
#   build     : pin prod, `cargo bench --no-run` for the PLANNED width targets,
#               upload the compiled criterion exes + Cargo.lock as `bbc-compiled`.
#   bench      : matrix of (width, scale) cells from `plan`; download `bbc-compiled`,
#               invoke the prebuilt exe directly with a `-- s<scale>` name-filter
#               (NO recompile), upload that cell's criterion subtree.
#   aggregate  : needs ALL bench cells; merge every cell into one criterion tree,
#               run summarise.py -> a worst-first (op x width x scale) regression
#               table printed to the run summary, plus a single `bbc-aggregate`
#               artifact (combined tree + medians .tsv + rendered .md + the run
#               config). Publishes the medians ONLY for the full default sweep.
#
# Triggers: (1) push to `main` — publishes the fresh timing medians to the `ci-data`
# data branch, exactly like the other producers (history / lib-perf / golden); (2)
# manual workflow_dispatch against any ref. NOT release/* (see the `on:` note).
#
# PARAMETERISED RUNS — the tier feature set is a dispatch input, and it is applied
# to BOTH dep lines (branch and prod) from one resolved value, because a
# comparison whose two sides carry different features is not a comparison. The
# build job asserts the two feature arrays are byte-identical before compiling.
#
# The point of the `features` input is the rule that enabling a feature may cost
# COMPILE time but must NOT cost RUNTIME. `MAX_WORK_N`
# (src/int/algos/support/limbs.rs) is `#[cfg]`-selected by these very features —
# 2 narrow, 16 at `wide`, 32 at `x-wide`, 64 at `xx-wide` — and the build-max
# scratch sizing derives from it, so an unused tier's mere presence can change a
# used tier's speed. This workflow could never see that while it hardcoded every
# feature.
#
# Read the result ACROSS runs, not within one: bbc compares branch vs prod at the
# SAME features, so both sides move together and the ratio stays ~1.00 whatever
# the feature set. Dispatch the SAME ref twice with different `features`, then
# compare the `prod_ns` column of the two `bbc_medians.tsv` artifacts cell by
# cell — identical code, one variable. (`prod_ns` is the right column: it is the
# published baseline, unaffected by whatever the branch is changing.)
#
# The concurrency group is deliberately per-ref, so two dispatches on one ref
# serialise instead of competing for runners — an A/B whose halves ran under
# different machine load would not be an A/B.
#
# CROSS-CELL READINGS AND THE `group` INPUT — every bench job is its own
# GitHub-hosted runner VM. Branch and prod for a cell are always measured in the
# SAME job, so the branch/prod ratio cancels machine speed: that column is sound
# in every mode, and bbc remains a correct branch-vs-prod instrument. A ratio
# taken BETWEEN cells is a different quantity. Under the default per-cell
# fan-out those two numbers came off two different VMs, and the null
# distribution on IDENTICAL code is p50 1.11x, p90 1.60x, p99 2.2x, max 6.8x —
# so width monotonicity (D18 vs D38) and scale monotonicity (D18<9> vs D18<13>),
# which are read entirely across cells, are not measurable that way.
#
# `group` chooses how cells map to jobs:
#   cell   (default) one job per cell. Maximum fan-out, wall time = the slowest
#          single cell. This is the full-sweep shape and the `main` push path.
#   width  one job per width, running that width's whole scale grid in sequence
#          — cross-SCALE ratios at a fixed width become same-machine.
#   all    one job for everything selected — cross-WIDTH ratios too. Serialises
#          every cell, so pair it with a small `widths` selection.
#
# Only `group: cell` at the default features over every width publishes; a
# grouped run is by construction a different measurement and stays artifact-only.

on:
  # Push to `main` runs the branch-vs-latest-tag bench and publishes its timing medians
  # to the unprotected, data-only `ci-data` branch (via scripts/push_ci_data.sh — a
  # GITHUB_TOKEN push there is loop-safe and never touches protected `main`), matching
  # history / lib-perf / golden. NOT release/*: on a release branch with an open PR the
  # else-path self-commit would churn the PR head onto a commit the REQUIRED gates never
  # run on, so the release-branch refresh stays dispatch-only.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to benchmark against prod, the latest published release (defaults to the branch the run is launched from)."
        required: false
        type: string
        default: ""
      features:
        description: "TIER features for BOTH sides, csv (wide / x-wide / xx-wide / d57..d1232). `none` = narrow-only. std+strict are always applied. Default = every tier, i.e. today's behaviour."
        required: false
        type: string
        default: "wide,x-wide,xx-wide"
      widths:
        description: "Widths to bench, csv (e.g. D57 or D18,D38,D57). `all` = every width the feature set can build. A width the features cannot build is rejected before anything compiles."
        required: false
        type: string
        default: "all"
      group:
        description: "How cells map to runner jobs. `cell` (default) = one job per cell, max fan-out, cross-cell ratios INVALID. `width` = one job per width, so cross-SCALE ratios are same-machine. `all` = one job for everything selected, so cross-WIDTH ratios are too."
        required: false
        type: choice
        options: ["cell", "width", "all"]
        default: "cell"
      micro_bench:
        description: "MICRO MODE. A [[bench]] name from benches/micro/ (e.g. ln_wide_series_tang_ab). Set this and the surface sweep is skipped entirely — this runs that one N-way comparison instead. Leave empty for the normal prod-vs-branch run."
        required: false
        type: string
        default: ""
      micro_features:
        description: "Micro mode only: cargo features. Must cover the bench's required-features or cargo SKIPS it and still exits 0."
        required: false
        default: "wide x-wide xx-wide bench-alt"
        type: string
      micro_filter:
        description: "Micro mode only: criterion name filter (honoured only by benches calling configure_from_args)."
        required: false
        default: ""
        type: string
      micro_env:
        description: "Micro mode only: extra env, one KEY=VALUE per line (e.g. LN_AB_ONLY=ln_d76)."
        required: false
        default: ""
        type: string

# Keyed on the branch AND the run's CONFIGURATION, not the branch alone.
#
# A concurrency group holds exactly ONE pending run. `cancel-in-progress: false`
# protects the RUNNING one and does nothing for the queued one: when a third
# dispatch arrives, the waiting run is silently cancelled. Keyed on the branch
# alone, every dispatch on a branch collided with every other, and three
# separate agents lost work to it — an A/B whose two halves differ only by the
# `ref` input, and a feature comparison whose halves differ only by `features`,
# each cancelled its own other half.
#
# Including the inputs means genuinely different measurements on one branch run
# CONCURRENTLY, while two byte-identical dispatches still serialise. That second
# case is the replication run, and serialising it is the point: two identical
# measurements should not compete for runners with each other.
concurrency:
  group: >-
    bench-branch-compare-${{ github.ref }}-${{ inputs.ref }}-${{ inputs.features }}-${{
    inputs.widths }}-${{ inputs.group }}-${{ inputs.micro_bench }}-${{ inputs.micro_filter }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # plan: turn the two dispatch inputs into a build plan, and fail FAST on an
  # inconsistent one. A `wide`-only build has no `D924` type, so asking for that
  # cell is a compile error — but only after the ~20 min compile. This job costs
  # seconds and says exactly which feature the width needs.
  #
  # No toolchain, no cargo: bbc_plan.py is stdlib-only. It parses the benchable
  # widths + their scale sets out of `benches/compare_d*.rs` (the `width_bench!`
  # invocations) and the feature ladder out of the crate's own `[features]`
  # table, so neither the matrix nor the tier map is a hand-maintained copy that
  # can drift from the thing it describes.
  plan:
    name: "\U0001FA83 plan (resolve features + widths)"
    # Micro mode replaces the whole sweep. Skipping `plan` skips build/bench with
    # it (they need it), and `aggregate`'s `needs.plan.result == 'success'` is
    # false for a skipped plan, so nothing downstream runs and nothing is
    # published. A `push` event supplies no inputs, so this is always true there.
    if: ${{ !inputs.micro_bench }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      features_toml: ${{ steps.plan.outputs.features_toml }}
      features_csv: ${{ steps.plan.outputs.features_csv }}
      widths_csv: ${{ steps.plan.outputs.widths_csv }}
      bench_args: ${{ steps.plan.outputs.bench_args }}
      cell_count: ${{ steps.plan.outputs.cell_count }}
      job_count: ${{ steps.plan.outputs.job_count }}
      group: ${{ steps.plan.outputs.group }}
      bench_timeout: ${{ steps.plan.outputs.bench_timeout }}
      is_default: ${{ steps.plan.outputs.is_default }}
    steps:
      - name: Checkout (${{ inputs.ref || github.ref_name }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve the run plan
        id: plan
        working-directory: bench-compare
        env:
          # Through `env`, never string-interpolated into the script: these are
          # caller-supplied. bbc_plan.py accepts only names present in the
          # crate's own feature table / bench targets, so nothing downstream
          # ever sees an arbitrary string.
          BBC_FEATURES: ${{ inputs.features }}
          BBC_WIDTHS: ${{ inputs.widths }}
          BBC_GROUP: ${{ inputs.group }}
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python3 bbc_plan.py \
            --features "${BBC_FEATURES:-}" \
            --widths "${BBC_WIDTHS:-all}" \
            --group "${BBC_GROUP:-cell}" \
            --summary plan_summary.md
          cat plan_summary.md >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # build: pin prod and compile the PLANNED widths' bench exes ONCE. The compiled
  # criterion executables + the resolved Cargo.lock are uploaded so the bench
  # cells run them directly with a scale name-filter — no per-cell recompile.
  build:
    name: "\U0001FA83 build (${{ needs.plan.outputs.widths_csv }} @ ${{ needs.plan.outputs.features_csv }})"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (${{ inputs.ref || github.ref_name }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install system libs
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true; sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo registry + git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-branch-compare-${{ runner.os }}-${{ hashFiles('bench-compare/benches/compare_common.rs') }}
          restore-keys: |
            cargo-branch-compare-${{ runner.os }}-

      - name: Pin prod, and set the SAME features on both sides
        working-directory: bench-compare
        env:
          # One resolved value, written to BOTH dep lines. A bbc run whose two
          # sides carry different features is not a comparison — and it would
          # fail in the flattering direction, since the side with fewer tiers
          # gets smaller build-max scratch and looks like a large free win.
          FEATURES_TOML: ${{ needs.plan.outputs.features_toml }}
        run: |
          set -euo pipefail
          LATEST=$(curl -s -H 'User-Agent: decimal-scaled-bench (github.com/mootable/decimal-scaled)' https://crates.io/api/v1/crates/decimal-scaled | python3 -c "import sys,json; d=json.load(sys.stdin); c=d['crate']; print(c.get('max_stable_version') or c['newest_version'])")
          echo "latest published tag = $LATEST"
          echo "PROD_VERSION=$LATEST" >> "$GITHUB_ENV"
          # `|` delimiter: the replacements contain `"` but never `|`, `&` or a
          # backslash (bbc_plan.py emits only names from the crate's own feature
          # table, so the value is a closed set of `[a-z0-9-]` words).
          sed -i -E "s|^decimal-scaled = .*|decimal-scaled = { path = \"..\", default-features = false, features = [${FEATURES_TOML}] }|" Cargo.toml
          sed -i -E "s|^prod = .*|prod = { package = \"decimal-scaled\", version = \"=$LATEST\", default-features = false, features = [${FEATURES_TOML}] }|" Cargo.toml

      - name: Assert branch and prod carry identical features
        working-directory: bench-compare
        run: |
          set -euo pipefail
          echo "--- dep lines ---"; grep -E '^(decimal-scaled|prod) = ' Cargo.toml
          extract() { grep -E "^$1 = " Cargo.toml | sed -E 's/.*features = \[([^]]*)\].*/\1/'; }
          BRANCH_FEATS=$(extract 'decimal-scaled')
          PROD_FEATS=$(extract 'prod')
          if [ -z "$BRANCH_FEATS" ] || [ -z "$PROD_FEATS" ]; then
            echo "::error::could not read a features array off both dep lines — the manifest shape changed and the rewrite above silently did nothing."
            exit 1
          fi
          if [ "$BRANCH_FEATS" != "$PROD_FEATS" ]; then
            echo "::error::branch and prod feature sets DIFFER — every number this run produced would be meaningless."
            echo "  branch: [$BRANCH_FEATS]"
            echo "  prod:   [$PROD_FEATS]"
            exit 1
          fi
          echo "both sides: [$BRANCH_FEATS]"

      - name: Compile the planned width bench exes (no run)
        working-directory: bench-compare
        env:
          # `--bench compare_dNNN ...` for the planned widths only. Compiling
          # just these is what makes a single-width dispatch fast, and it is
          # also what lets a reduced feature set compile at all: the bench
          # targets declare no `required-features`, so a whole-target-set build
          # would try to compile `compare_d924.rs` against a crate that has no
          # `D924`.
          BENCH_ARGS: ${{ needs.plan.outputs.bench_args }}
        run: |
          set -euo pipefail
          echo "compiling: $BENCH_ARGS"
          # Unquoted on purpose — the planner emits a validated flag list that
          # must word-split into separate arguments.
          # shellcheck disable=SC2086
          cargo bench --no-run $BENCH_ARGS
          echo "--- compiled compare exes ---"
          ls -1 target/release/deps/compare_d*-* | grep -v '\.d$' || true

      - name: Stage the compiled exes + lockfile
        working-directory: bench-compare
        run: |
          set -euo pipefail
          mkdir -p staged/deps
          # The criterion bench executables only (drop the cargo `.d` depfiles).
          for f in target/release/deps/compare_d*-*; do
            case "$f" in
              *.d) ;;                      # skip depfiles
              *) cp "$f" staged/deps/ ;;
            esac
          done
          cp Cargo.lock staged/Cargo.lock
          echo "PROD_VERSION=${PROD_VERSION}" > staged/prod_version.env
          echo "--- staged ---"; ls -1 staged/deps/

      - name: Upload compiled bench exes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bbc-compiled
          path: bench-compare/staged/
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # bench: one job per matrix entry. Downloads the prebuilt exes and runs the
  # entry's cells by invoking the matching exe with a `_s<scale>/` criterion
  # name-filter. No toolchain, no recompile.
  #
  # An entry carries `widths` + `scales` (csv, or `scales: all`), so ONE loop
  # serves every grouping: in the default `cell` mode an entry is a single
  # (width, scale) pair and the job is exactly what it always was; in `width`
  # mode it is one width's whole scale grid; in `all` mode it is everything
  # selected.
  #
  # WHY GROUPING IS A MEASUREMENT CONTROL, not scheduling: each job is its own
  # runner VM. Branch and prod for a given cell are always measured in the SAME
  # job, so the branch/prod ratio cancels machine speed and is valid in every
  # mode. A ratio taken BETWEEN cells is a different matter — in `cell` mode
  # those two numbers came off two different VMs, and the null distribution on
  # identical code is p50 1.11x, p90 1.60x, p99 2.2x, max 6.8x. Width and scale
  # monotonicity are read entirely across cells, so they need `group: width` (a
  # scale grid on one machine) or `group: all` (widths too).
  bench:
    name: "\U0001FA83 ${{ matrix.name }}"
    needs: [plan, build]
    runs-on: ubuntu-latest
    # A grouped job runs its cells in sequence, so `plan` scales the budget by
    # the cells the largest entry carries (the per-cell fan-out keeps its 20).
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.bench_timeout) }}
    strategy:
      fail-fast: false
      # The cells come from `plan`, which reads them off the `width_bench!`
      # invocation in each `benches/compare_d*.rs` and keeps only the selected
      # widths. Scales differ per width, so it stays an `include:` list rather
      # than a cross-product; per #1 the set is {0, S/4, S/2, 3S/4, S-1},
      # S = the tier's max SCALE.
      #
      # This replaced a hand-written 60-line copy of the same table, which was a
      # standing drift risk: a changed scale set in a bench file did not update
      # the matrix, and the cell simply benched nothing.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Install system libs (criterion runtime)
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true; sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Download compiled bench exes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bbc-compiled
          path: bbc-compiled

      - name: Run ${{ matrix.name }}
        env:
          # csv from `plan`. `SCALES=all` means this width's whole grid, which
          # is the same thing as running the exe with no name-filter at all.
          BBC_ENTRY_WIDTHS: ${{ matrix.widths }}
          BBC_ENTRY_SCALES: ${{ matrix.scales }}
        run: |
          set -euo pipefail
          # Everything this job runs happens HERE, in one shell on one runner —
          # that co-location is the whole point of the grouped modes.
          for W in $(echo "$BBC_ENTRY_WIDTHS" | tr ',' ' '); do
            WIDTH_LC=$(echo "$W" | tr '[:upper:]' '[:lower:]')
            # Resolve the hashed exe name by globbing: compare_<width_lc>-<hash>.
            # Written to a file first: `ls | head` can SIGPIPE `ls` once head has
            # its line, and `pipefail` would then abort the job.
            ls -1 bbc-compiled/deps/compare_${WIDTH_LC}-* > /tmp/bbc_exes.txt
            EXE=$(grep -v '\.d$' /tmp/bbc_exes.txt | head -1)
            if [ -z "$EXE" ]; then echo "no exe for compare_${WIDTH_LC}"; exit 1; fi
            chmod +x "$EXE"
            if [ "$BBC_ENTRY_SCALES" = "all" ]; then
              # No filter: criterion runs every group in this width's target,
              # i.e. the tier's whole scale set, back to back on this machine.
              echo "running: $EXE --bench   (all scales for $W)"
              "$EXE" --bench
            else
              for S in $(echo "$BBC_ENTRY_SCALES" | tr ',' ' '); do
                # Each benched id is `<op>_D###_s<scale>/<side>`. Filtering on the
                # `_s<scale>/` substring (with the trailing group/function
                # separator) selects EXACTLY this scale's groups and no other:
                # e.g. `_s30/` does NOT match `_s306/` because the `/` lands right
                # after the scale. (Verified locally on D307, which has both.)
                FILTER="_s${S}/"
                echo "running: $EXE --bench $FILTER --"
                "$EXE" --bench "$FILTER" --
              done
            fi
          done
          echo "--- produced groups ---"
          ls -1 target/criterion 2>/dev/null || true

      - name: Upload criterion subtree
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # `plan` names a `cell`-mode entry `D18-s0`, so the default run's
          # artifacts keep the exact names they have always had.
          name: bbc-${{ matrix.name }}
          path: target/criterion/
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------
  # aggregate: the final join. Needs every bench cell, merges them into one
  # criterion tree, renders the worst-first regression table to the run summary
  # and bundles ONE downloadable artifact (tree + medians .tsv + table .md).
  aggregate:
    name: "\U0001FA83 aggregate (worst-first regression table)"
    needs: [plan, bench]
    # Still aggregate when some bench cells failed (partial data beats none),
    # but not when PLANNING failed — there is nothing to collate, and the
    # `is_default` output the publish gate reads would be an empty string.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Self-commit the timing medians back to the run's branch (the
      # same self-render aggregate pattern; a GITHUB_TOKEN push does not
      # re-trigger workflows, so there is no refresh loop).
      contents: write
    steps:
      - name: Checkout (for summarise.py)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Re-derive prod version for the table header
        run: |
          set -euo pipefail
          LATEST=$(curl -s -H 'User-Agent: decimal-scaled-bench (github.com/mootable/decimal-scaled)' https://crates.io/api/v1/crates/decimal-scaled | python3 -c "import sys,json; d=json.load(sys.stdin); c=d['crate']; print(c.get('max_stable_version') or c['newest_version'])")
          echo "PROD_VERSION=$LATEST" >> "$GITHUB_ENV"

      - name: Download every (width, scale) bench cell
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # No `name` -> every artifact this run uploaded, each into a subdir
          # named after the artifact (bbc-D18-s0/, bbc-D307-s153/, ...).
          # We only care about the `bbc-<width>-s<scale>` cells (the
          # `bbc-compiled` exe blob is harmless extra weight).
          path: bbc-cells

      - name: Merge every cell into one criterion tree
        run: |
          set -euo pipefail
          mkdir -p bench-compare/target/criterion
          shopt -s nullglob
          # Each bench artifact is that job's `target/criterion` subtree directly.
          # The glob is `bbc-*` rather than `bbc-*-s*` because a grouped job is
          # named `bbc-D57-all` / `bbc-all`, with no `-s<scale>` segment; the
          # explicit skip below is what keeps the compiled-exe blob out.
          for d in bbc-cells/bbc-*/; do
            # Skip the compiled-exe artifact, which matches this glob.
            [ -d "$d" ] || continue
            case "$d" in *bbc-compiled*) continue;; esac
            echo "merging $d"
            cp -a "$d/." bench-compare/target/criterion/ 2>/dev/null || true
          done
          # List once to a file, then sample/count from the file. Piping
          # `ls` straight into `head` makes `ls` race a closed pipe once
          # head has its 40 lines -> SIGPIPE -> "write error: Broken pipe"
          # -> non-zero -> `set -o pipefail` aborts the whole job. Reading
          # head/wc from a file sidesteps the pipe entirely.
          ls -1 bench-compare/target/criterion > /tmp/bbc_groups.txt
          echo "--- merged group dirs (sample) ---"
          head -40 /tmp/bbc_groups.txt
          echo "--- group count ---"
          wc -l < /tmp/bbc_groups.txt

      - name: Collate -> worst-first regression table (+ tsv + md)
        working-directory: bench-compare
        env:
          BENCH_REF: ${{ inputs.ref || github.ref_name }}
          PYTHONIOENCODING: utf-8
          RUN_FEATURES: ${{ needs.plan.outputs.features_csv }}
          RUN_WIDTHS: ${{ needs.plan.outputs.widths_csv }}
          RUN_CELLS: ${{ needs.plan.outputs.cell_count }}
          RUN_JOBS: ${{ needs.plan.outputs.job_count }}
          RUN_GROUP: ${{ needs.plan.outputs.group }}
          RUN_IS_DEFAULT: ${{ needs.plan.outputs.is_default }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p aggregate
          # Print to stdout (raw log) AND capture the table for the step summary.
          python3 summarise.py --tsv aggregate/bbc_medians.tsv --md aggregate/bbc_table.md | tee aggregate/bbc_table.txt
          # What this run WAS, travelling with the numbers. A feature-varied A/B
          # compares the `prod_ns` column of two artifacts, and the feature set
          # is the whole independent variable — it must not be something the
          # reader has to reconstruct from the run's dispatch inputs later.
          if [ "$RUN_GROUP" = "cell" ]; then
            CROSS_CELL="no - every cell ran on its own runner VM"
          else
            CROSS_CELL="yes, within a job - ${RUN_GROUP}-grouped"
          fi
          cat > aggregate/bbc_run_config.env <<EOF
          BBC_REF=${BENCH_REF}
          BBC_SHA=${RUN_SHA}
          BBC_PROD_VERSION=${PROD_VERSION}
          BBC_FEATURES=${RUN_FEATURES}
          BBC_WIDTHS=${RUN_WIDTHS}
          BBC_GROUP=${RUN_GROUP}
          BBC_CELLS=${RUN_CELLS}
          BBC_JOBS=${RUN_JOBS}
          BBC_CROSS_CELL_COMPARABLE=${CROSS_CELL}
          BBC_IS_DEFAULT_SWEEP=${RUN_IS_DEFAULT}
          EOF
          echo "--- run config ---"; cat aggregate/bbc_run_config.env
          # Append the rendered markdown to the GitHub Actions run summary UI,
          # under a banner when the numbers are NOT the tracked full surface.
          {
            echo ""
            if [ "$RUN_IS_DEFAULT" != "true" ]; then
              echo "> **Parameterised run — not the tracked surface.** Features"
              echo "> \`${RUN_FEATURES}\`, widths \`${RUN_WIDTHS}\`, grouping \`${RUN_GROUP}\`"
              echo "> (${RUN_CELLS} cells in ${RUN_JOBS} job(s))."
              echo "> Medians are in the \`bbc-aggregate\` artifact only; nothing was published."
              echo ""
            fi
            if [ "$RUN_GROUP" = "cell" ]; then
              echo "> **Cross-cell ratios in this table are NOT valid.** Each cell ran on"
              echo "> its own runner VM, so a ratio between two cells carries the machine"
              echo "> difference (p50 1.11x, p90 1.60x, max 6.8x on identical code). The"
              echo "> branch-vs-prod columns are unaffected — those two are measured in the"
              echo "> same job. For a cross-scale or cross-width reading, re-dispatch with"
              echo "> \`group: width\` or \`group: all\`."
            else
              echo "> **Cross-cell ratios are same-machine within a job** (\`group:"
              echo "> ${RUN_GROUP}\`), so scale/width monotonicity may be read off this table."
            fi
            echo ""
            cat aggregate/bbc_table.md
          } >> "$GITHUB_STEP_SUMMARY"
          # Bundle the combined criterion tree into the aggregate dir too.
          cp -a target/criterion aggregate/criterion

      - name: Commit the timing medians to results/timing/
        # TWO conditions, and both are load-bearing:
        #
        # 1. The run targets its own branch HEAD — a push event (inputs.ref
        #    unset) or a dispatch with no ref override. A dispatch against an
        #    explicit tag/SHA/other-branch stays artifact-only: `HEAD:<tag-or-sha>`
        #    is never a valid push target, and rendered docs belong to a branch.
        #
        # 2. The run is the FULL DEFAULT SWEEP. `results/timing/bbc_medians.tsv`
        #    is not a scratch file: scripts/render_docs.py renders the published
        #    Performance page from it, and docs.yml reads it off `ci-data`. A
        #    narrowed or reduced-feature run produces the same filename holding
        #    a different measurement — fewer cells, or the same cells built
        #    against a different `MAX_WORK_N`. Committing that would silently
        #    replace the tracked surface with a subset, or restate every number
        #    under a build no consumer of the docs is running. So a
        #    parameterised run is artifact-only, and `plan` decides by comparing
        #    the resolved feature CLOSURE (not the typed string) against the
        #    default — `xx-wide` alone builds identically to the default and
        #    still publishes.
        #
        # The `main` push path carries no inputs, so it resolves to the default
        # and publishes exactly as before.
        if: ${{ !inputs.ref && needs.plan.outputs.is_default == 'true' }}
        run: |
          set -euo pipefail
          tsv=bench-compare/aggregate/bbc_medians.tsv
          if [ ! -f "$tsv" ]; then echo "no bbc_medians.tsv produced — skipping commit"; exit 0; fi
          mkdir -p results/timing
          # The full benched (op × width × scale) surface — collect everything,
          # so a later docs table is a render-only change, never a re-run.
          cp "$tsv" results/timing/bbc_medians.tsv
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            # `main` is protected — a self-commit is declined (GH006). Publish the
            # raw medians to the unprotected `ci-data` data branch instead; the
            # docs build reads them from there. Nothing is rendered or committed
            # to `main` here (that stays the release-cadence snapshot).
            bash scripts/push_ci_data.sh results/timing/bbc_medians.tsv
          else
            # release/* (unprotected): self-commit the fresh medians + re-rendered
            # Performance page for the release PR — the RELEASING.md §3 refresh
            # path, unchanged. stdlib-only, no extra deps.
            python3 scripts/render_docs.py
            git add results/timing/bbc_medians.tsv
            git add -u README.md docs/
            if git diff --cached --quiet; then
              echo "timing medians + docs unchanged — nothing to commit"
              exit 0
            fi
            git commit -m "results(timing): refresh medians + render Performance page"
            # Incorporate any concurrent results/ self-commit (disjoint files) so
            # the push isn't rejected non-fast-forward. The step only runs when
            # inputs.ref is unset, so github.ref_name is the run's own branch.
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload single aggregate artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bbc-aggregate
          path: bench-compare/aggregate/
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------------
  # micro: ONE `benches/micro/*` N-way comparison. Replaces the sweep entirely
  # when `micro_bench` is set; every other job is skipped.
  #
  # WHY THIS BELONGS ON CI. Nothing here ever invoked `cargo bench` on
  # `benches/micro/*` -- the sweep builds and runs only `bench-compare/benches/*`.
  # So every dispatch-seam A/B (the `compare_all` ranking that decides which
  # algorithm a policy arm names) had to run on a developer machine, where the
  # build is unpinned and takes the whole box.
  #
  # WHY A SHARED RUNNER IS FINE HERE, unlike for the sweep's cross-cell ratios:
  # a micro-bench ranks every candidate IN ONE PROCESS on ONE machine, so the
  # runner's absolute speed cancels out of the comparison. The sweep puts each
  # (width, scale) cell on its own runner, which is exactly why ITS cross-cell
  # ratios carry a machine-to-machine floor. That failure mode cannot occur here.
  #
  # Advisory only: no self-commit, no data branch, no gate.
  micro:
    name: "\U0001F9EA micro (${{ inputs.micro_bench }})"
    if: ${{ inputs.micro_bench }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # The surface `build` and `bench` jobs both install this (see "Install
      # system libs" above); the micro job did not, so criterion's build pulled
      # `yeslogic-fontconfig-sys`, whose build script ran `pkg-config`, found
      # nothing, and panicked before a single benchmark executed. The root
      # Cargo.toml already sets criterion `default-features = false`, yet
      # `plotters` is still in the graph — which is exactly why the surface jobs
      # carry this line despite the same declaration. The apt step is the fix;
      # chasing the feature flag is the longer road to the same place.
      - name: Install system libs
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true; sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-micro-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: bench-micro-${{ runner.os }}-

      # Fail in seconds on a typo rather than after a multi-minute compile.
      - name: Validate bench name
        env:
          BENCH: ${{ inputs.micro_bench }}
        run: |
          set -euo pipefail
          # Cargo.toml is committed CRLF (106 of 764 files are), and GNU grep on
          # the Linux runner treats the \r as a literal character, so a `$`
          # anchor can NEVER match. MSYS grep in git-bash treats CRLF as a line
          # terminator, so reproducing this step locally PASSES — the check lied
          # exactly where it was verified and failed where it runs. Every
          # micro-mode dispatch died here, on every bench.
          # Strip the CR from the INPUT rather than trying to match it. Two
          # earlier attempts failed here and both are worth not repeating:
          #   `…"$`      — Cargo.toml is committed CRLF (106 of 764 files are),
          #                and GNU grep treats the \r as an ordinary character,
          #                so the anchor could never match. Every micro dispatch
          #                died at this line, on every bench.
          #   `…"\r?$`   — INERT. Bash double quotes do not interpret \r, so
          #                grep receives backslash-r; POSIX ERE has no \r escape,
          #                so it reduces to the literal letter `r`. Verified:
          #                `^abc\r?$` matches both `abc` and `abcr`.
          # `tr` normalises the input and encodes no assumption about the regex
          # dialect or about which grep build the runner ships.
          if ! tr -d '\r' < Cargo.toml | grep -qE "^name = \"${BENCH}\"$"; then
            echo "::error::no [[bench]] named '${BENCH}' in Cargo.toml"
            echo "Benches under benches/micro/:"
            grep -B1 '^path = "benches/micro/' Cargo.toml | grep '^name = ' | sed 's/name = /  /'
            exit 1
          fi
          echo "bench '${BENCH}' found"

      - name: Run the comparison
        env:
          BENCH: ${{ inputs.micro_bench }}
          FEATURES: ${{ inputs.micro_features }}
          FILTER: ${{ inputs.micro_filter }}
          EXTRA_ENV: ${{ inputs.micro_env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              *=*) export "$line"; echo "env: ${line%%=*} set" ;;
              *) echo "::warning::ignoring malformed env line: $line" ;;
            esac
          done <<< "$EXTRA_ENV"

          mkdir -p micro-out
          set +e
          cargo bench --bench "$BENCH" --features "$FEATURES" -- $FILTER \
            2>&1 | tee micro-out/bench.log
          status=${PIPESTATUS[0]}
          set -e
          echo "cargo exit: $status"
          exit $status

      - name: Render verdicts to the run summary
        if: always()
        env:
          BENCH: ${{ inputs.micro_bench }}
          FEATURES: ${{ inputs.micro_features }}
          FILTER: ${{ inputs.micro_filter }}
        run: |
          set -uo pipefail
          log=micro-out/bench.log
          [ -f "$log" ] || { echo "no log produced" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          verdicts=$(grep -cE "A/B verdict" "$log" || true)
          {
            echo "## ${BENCH}"
            echo ""
            echo "features \`${FEATURES}\` · filter \`${FILTER}\` · **${verdicts} verdicts**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # ABSENCE OF FAILURE IS NOT EVIDENCE: a bench excluded by missing
          # required-features exits 0 having graded NOTHING. Say so loudly rather
          # than let a green tick read as a result.
          if [ "$verdicts" -eq 0 ]; then
            {
              echo "> **FAILED — no verdicts were produced. This graded nothing.**"
              echo "> Most often \`micro_features\` does not cover this bench's"
              echo "> \`required-features\`, so cargo skipped it and still exited 0."
            } >> "$GITHUB_STEP_SUMMARY"
            # A run that measured nothing must not report success. A green tick on
            # an empty run is worse than a red one: it gets read as evidence, and
            # `root_kernel_ab` sat broken for months behind exactly that.
            echo "::error::graded 0 comparisons — a bench that runs nothing is a failure"
            exit 1
          else
            {
              echo '```'
              # `|| true`: `head -200` closes the pipe on the 201st line, so
              # grep dies of SIGPIPE and `pipefail` turns that into a FAILED
              # step. A bench with more than 200 verdict lines therefore
              # reported failure while having graded everything perfectly
              # (run 33699946210: 1584 verdicts, "grep: write error: Broken
              # pipe", exit 2). A false red is as bad as a false green.
              grep -E "A/B verdict|slower\)|~tie" "$log" | head -200 || true
              if [ "$verdicts" -gt 200 ]; then
                echo "... truncated at 200 lines; the full log is in the artifact"
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload log and criterion tree
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bbc-micro-${{ inputs.micro_bench }}
          path: |
            micro-out/bench.log
            target/criterion/**
          retention-days: 14
          if-no-files-found: warn
