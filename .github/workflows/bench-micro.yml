name: "\U0001F9EA micro bench"

# Runs a single `benches/micro/*` N-way comparison on CI, on demand.
#
# WHY THIS EXISTS: `bench-branch-compare` builds and runs only
# `bench-compare/benches/*` — the prod-vs-branch surface sweep. Nothing in CI
# ever invoked `cargo bench` on `benches/micro/*`, so every dispatch-seam A/B
# (the `compare_all` ranking that decides which algorithm a policy arm should
# name) had to run on a developer machine. That is the wrong place for it: the
# builds are unpinned and take the whole box.
#
# WHY A SHARED RUNNER IS FINE HERE, unlike for cross-cell surface ratios: a
# micro-bench ranks every candidate IN ONE PROCESS on ONE machine. The runner's
# absolute speed cancels out of the comparison. (`bench-branch-compare` puts each
# (width, scale) cell on its OWN runner, which is why ITS cross-cell ratios carry
# a machine-to-machine floor. That problem does not exist in this workflow.)
#
# Advisory only: no self-commit, no data branch, no gate. The verdict lines land
# in the run summary; the full log and criterion tree land in an artifact.

on:
  workflow_dispatch:
    inputs:
      bench:
        description: "[[bench]] name from Cargo.toml, e.g. ln_wide_series_tang_ab"
        required: true
        type: string
      features:
        description: "Cargo features. Must cover the bench's required-features."
        required: false
        default: "wide x-wide xx-wide bench-alt"
        type: string
      filter:
        description: "criterion name filter (only benches calling configure_from_args honour it)"
        required: false
        default: ""
        type: string
      env_vars:
        description: "Extra env, one KEY=VALUE per line (e.g. LN_AB_ONLY=ln_d76)"
        required: false
        default: ""
        type: string

# Queue rather than clobber: a cancelled bench wastes the whole compile.
concurrency:
  group: bench-micro-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  micro:
    name: "\U0001F9EA ${{ inputs.bench }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-micro-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: bench-micro-${{ runner.os }}-

      # Fail in seconds on a typo rather than after a multi-minute compile.
      - name: Validate bench name
        run: |
          set -euo pipefail
          name='${{ inputs.bench }}'
          if ! grep -qE "^name = \"${name}\"$" Cargo.toml; then
            echo "::error::no [[bench]] named '${name}' in Cargo.toml"
            echo "Available:"
            grep -B1 '^path = "benches/micro/' Cargo.toml | grep '^name = ' | sed 's/name = /  /'
            exit 1
          fi
          echo "bench '${name}' found"

      - name: Run the comparison
        env:
          BENCH: ${{ inputs.bench }}
          FEATURES: ${{ inputs.features }}
          FILTER: ${{ inputs.filter }}
          EXTRA_ENV: ${{ inputs.env_vars }}
        run: |
          set -euo pipefail
          # One KEY=VALUE per line into the environment (e.g. LN_AB_ONLY).
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in *=*) export "$line"; echo "env: ${line%%=*} set" ;;
              *) echo "::warning::ignoring malformed env line: $line" ;;
            esac
          done <<< "$EXTRA_ENV"

          mkdir -p micro-out
          # `--features` must cover the bench's required-features or cargo
          # silently SKIPS it — an empty log that looks like a pass. The
          # verdict-count check below is what actually catches that.
          set +e
          cargo bench --bench "$BENCH" --features "$FEATURES" -- $FILTER \
            2>&1 | tee micro-out/bench.log
          status=${PIPESTATUS[0]}
          set -e
          echo "cargo exit: $status"
          exit $status

      - name: Render verdicts to the run summary
        if: always()
        run: |
          set -uo pipefail
          log=micro-out/bench.log
          [ -f "$log" ] || { echo "no log produced" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          verdicts=$(grep -cE "A/B verdict" "$log" || true)
          {
            echo "## ${{ inputs.bench }}"
            echo ""
            echo "features \`${{ inputs.features }}\` · filter \`${{ inputs.filter }}\` · **${verdicts} verdicts**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # ABSENCE OF FAILURE IS NOT EVIDENCE: a bench excluded by missing
          # required-features exits 0 having graded nothing. Say so loudly.
          if [ "$verdicts" -eq 0 ]; then
            {
              echo "> **No verdicts were produced.** The bench either did not run or"
              echo "> ranked nothing. Most often the \`features\` input does not cover"
              echo "> this bench's \`required-features\`, so cargo skipped it and still"
              echo "> exited 0. Check the artifact log before reading this as a result."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '```'
              grep -E "A/B verdict|slower\)|~tie" "$log" | head -200
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload log and criterion tree
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-micro-${{ inputs.bench }}
          path: |
            micro-out/bench.log
            target/criterion/**
          retention-days: 14
          if-no-files-found: warn
